<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>NEARBY — Social Food Discovery</title>
  <meta name="description" content="A web prototype for scrolling nearby food and exploring Google, Instagram, and TikTok reviews." />
  <style>
:root{--bg:#101010;--text:#f5f5f5;--muted:#a0a0a0;--stroke:#303030;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#080808;color:var(--text);overflow:hidden}
button,input,a{font:inherit;touch-action:manipulation}
button{color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,.feed:focus-visible{outline:2px solid #fff;outline-offset:4px}
button[hidden],[hidden]{display:none!important}
.app{height:100svh;position:relative;overflow:clip;background:var(--bg)}
[inert]{pointer-events:none}
.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;padding:13px 18px;border:0;border-radius:6px;background:#f5f5f5;color:#111;font-size:15px;font-weight:550;text-decoration:none}
.primary svg{width:18px;height:18px}
.secondary{min-height:44px;padding:10px 0;border:0;background:none;color:var(--muted);font-size:14px}
.muted{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.6}
.landing{position:absolute;inset:0;z-index:10;display:flex;align-items:center;padding:32px;background:var(--bg)}
.landing.hide{display:none}
.hero-card{width:100%;max-width:350px;margin:auto}
.eyebrow{margin-bottom:24px;font-size:14px;font-weight:500}
h1{margin:0;font-size:46px;font-weight:550;line-height:1.06;letter-spacing:-.045em}
.hero-card p{margin:20px 0 40px;font-size:16px;line-height:1.6;color:var(--muted);max-width:260px}
.hero-card .secondary{display:block;width:100%;margin-top:8px;text-align:center}
.demo-note{margin-top:32px;color:var(--muted);font-size:12px}
.home{position:absolute;inset:0;z-index:5;visibility:hidden}
.home.show{visibility:visible}
.topbar{position:absolute;z-index:30;left:0;right:0;top:0;height:calc(72px + env(safe-area-inset-top));padding:calc(12px + env(safe-area-inset-top)) 24px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(#0008,transparent);pointer-events:none}
.location-pill,.range-pill,.icon-btn{pointer-events:auto;display:flex;align-items:center;min-height:44px;padding:0;border:0;background:none;border-radius:0;box-shadow:none}
.location-pill{min-width:0;margin-right:auto;font-size:14px;font-weight:500}
.location-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.range-pill{flex-shrink:0;gap:7px;font-size:14px;color:#eee}
.range-pill svg{width:17px;height:17px}
.icon-btn{flex-shrink:0;width:32px;justify-content:flex-end;position:relative}
.icon-btn svg{width:20px;height:20px}
.icon-btn.active:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;right:0;bottom:4px;background:#fff}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{height:100svh;position:relative;overflow:clip;scroll-snap-align:start;background:#161616}
.reel-bg{position:absolute;inset:0;background-position:center;background-size:cover}
.reel:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0004,transparent 18%,transparent 42%,#0009 68%,#101010 91%);pointer-events:none}
.reel-content{position:absolute;z-index:4;left:24px;right:24px;bottom:calc(96px + env(safe-area-inset-bottom))}
.dish-button{display:block;text-align:left;padding:0;border:0;background:none}
.dish{max-width:360px;margin:0 0 10px;font-size:30px;font-weight:550;line-height:1.12;letter-spacing:-.035em;overflow-wrap:anywhere}
.restaurant{margin:0;font-size:15px;line-height:1.4;color:#ddd}
.rating-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;font-size:14px;color:#ccc}
.rating-button{padding:0;border:0;background:none;font-size:14px;color:#eee;min-height:30px}
.tiny-sep{color:#888}
.action-stack{display:flex;gap:12px;align-items:center;margin-top:20px}
.action{display:flex;align-items:center;justify-content:center;gap:8px;width:44px;height:44px;padding:0;border:0;background:none;border-radius:4px}
.action svg{width:21px;height:21px}
.review-action{width:auto;margin-right:auto;font-size:14px}
.review-action svg{width:18px;height:18px}
.action.is-saved svg{fill:currentColor}
.bottom-nav{position:absolute;z-index:40;left:0;right:0;bottom:0;height:calc(68px + env(safe-area-inset-bottom));padding:0 24px env(safe-area-inset-bottom);display:flex;justify-content:space-between;align-items:center;background:#101010;border-top:1px solid #ffffff0d}
.nav-btn{position:relative;min-height:52px;padding:0;border:0;background:none;color:#888;font-size:14px;font-weight:450}
.nav-btn.active{color:#fff}
.nav-btn.active:after{content:"";position:absolute;bottom:5px;left:0;right:0;height:1px;background:#fff}
.nav-btn svg{display:none}
.map-screen,.saved-screen{display:none;position:absolute;inset:0;z-index:12;background:var(--bg);overflow:clip}
.map-screen.show,.saved-screen.show{display:block}
.map-canvas{position:absolute;inset:0;background:#181818}
.road{position:absolute;background:#242424;transform-origin:left center}
.road.r1{width:120%;height:12px;left:-10%;top:34%;transform:rotate(-12deg)}
.road.r2{width:110%;height:8px;left:-12%;top:58%;transform:rotate(18deg)}
.road.r3{width:86%;height:6px;left:14%;top:72%;transform:rotate(-4deg)}
.road.r4{width:8px;height:78%;left:57%;top:8%;transform:rotate(8deg)}
.map-label{position:absolute;z-index:2;top:94px;left:24px;color:var(--muted);font-size:12px}
.me-dot{position:absolute;left:51%;top:46%;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:#999}
.pin{position:absolute;z-index:3;width:48px;height:48px;padding:2px;background:#202020;border:1px solid #555;border-radius:50%}
.pin.selected{border:2px solid #fff}
.pin img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.map-pin-label{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:#ddd}
.map-card{position:absolute;z-index:7;bottom:calc(88px + env(safe-area-inset-bottom));left:24px;right:24px;display:flex;align-items:center;gap:12px;padding:16px;background:#101010;border-radius:6px}
.map-card img{width:54px;height:64px;object-fit:cover;border-radius:3px}
.map-card h3{margin:0 0 6px;font-size:16px;font-weight:500;line-height:1.3}
.map-card p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.mini-cta{display:grid;place-items:center;flex-shrink:0;width:36px;height:44px;margin-left:auto;background:none;border:0}
.mini-cta svg{width:20px;height:20px}
.map-empty{position:absolute;left:24px;right:24px;top:42%;text-align:center;color:var(--muted);font-size:15px}
.saved-screen{padding:100px 24px calc(100px + env(safe-area-inset-bottom));overflow-y:auto}
.saved-screen h2{margin:0 0 26px;font-size:28px;font-weight:500;letter-spacing:-.03em}
.saved-grid{display:flex;flex-direction:column}
.saved-card{display:flex;align-items:center;width:100%;gap:16px;padding:20px 0;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid #282828}
.saved-card img{width:80px;height:92px;flex-shrink:0;object-fit:cover;border-radius:3px}
.saved-card b{display:block;margin-bottom:8px;font-size:16px;line-height:1.4;font-weight:500}
.saved-card span{font-size:13px;line-height:1.7;color:var(--muted)}
.saved-empty{font-size:16px;line-height:1.7;color:var(--muted)}
.empty-state{height:100%;display:flex;flex-direction:column;justify-content:center;padding:120px 32px;background:var(--bg)}
.empty-state h2{font-size:28px;font-weight:500;letter-spacing:-.03em;margin:0 0 14px}
.empty-state p{font-size:16px;line-height:1.6;color:var(--muted);margin:0 0 26px}
.empty-state .primary{width:auto;align-self:flex-start}
.sheet-dialog{position:fixed;inset:auto 0 0;margin:0 auto;width:min(100%,520px);max-height:calc(100svh - 32px);padding:20px 24px calc(28px + env(safe-area-inset-bottom));border:0;border-top:1px solid #333;border-radius:12px 12px 0 0;color:var(--text);background:#181818;overflow-y:auto;overscroll-behavior:contain}
.sheet-dialog::backdrop{background:#0008}
.dialog-top{height:36px;position:relative}
.grab{width:30px;height:2px;background:#555;margin:0 auto}
.close-btn{display:grid;place-items:center;position:absolute;top:-8px;right:-8px;width:40px;height:40px;padding:0;background:none;border:0;font-size:26px;font-weight:300;color:#aaa}
.sheet-dialog h2{font-size:24px;line-height:1.2;letter-spacing:-.025em;font-weight:500;margin:6px 0 12px}
.sheet-dialog h3,.filter-title{font-size:14px;line-height:1.4;font-weight:500;margin:26px 0 12px}
.ranges,.filter-categories{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.filter-categories{grid-template-columns:repeat(3,1fr)}
.range-option,.filter-chip{min-height:44px;padding:10px 6px;border:1px solid #3b3b3b;border-radius:4px;background:none;font-size:14px;font-weight:400}
.range-option.active,.filter-chip.active{border-color:#ddd;background:#eee;color:#111}
.filter-toggles{display:flex;gap:10px;margin:20px 0 28px}
.filter-toggles .filter-chip{flex:1}
.filter-actions{display:flex;align-items:center;gap:24px;margin-top:24px}
.filter-actions .secondary{padding:12px 8px}
#searchInput{width:100%;padding:14px 0;margin:8px 0 24px;background:none;border:0;border-bottom:1px solid #555;border-radius:0;color:#fff;font-size:18px}
.detail-photo{width:100%;height:128px;object-fit:cover;margin:4px 0 16px;border-radius:3px}
.detail-meta{display:flex;gap:8px 16px;flex-wrap:wrap;color:#ccc;font-size:14px;line-height:1.6;margin:18px 0}
.detail-actions{display:flex;gap:12px;margin:22px 0 28px}
.detail-actions button{flex:1;font-size:14px}
.detail-actions .outline{border:1px solid #555;background:none;color:#eee}
.review-tabs{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #333;margin-bottom:4px}
.review-tab{position:relative;min-height:44px;padding:10px 0;border:0;background:none;font-size:14px;color:var(--muted)}
.review-tab.active{color:#fff}
.review-tab.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:1px;background:#eee}
.review-card{padding:20px 0;border-bottom:1px solid #303030}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.review-by{flex:1;font-size:14px}.review-by small{display:block;margin-top:5px;color:var(--muted);font-size:12px}
.review-source{font-size:12px;color:var(--muted)}
.review-card p{font-size:16px;line-height:1.6;margin:8px 0 0}
.review-foot,.demo-label,.reviews-note{font-size:12px;line-height:1.6;color:var(--muted)}
.review-foot{margin-top:10px}.review-stars{font-size:13px;letter-spacing:1px;color:#ddd}.reviews-note{margin:20px 0 0}
.route-preview{padding:24px 0;margin:12px 0;border-top:1px solid #333;border-bottom:1px solid #333}
.route-preview strong{display:block;font-size:36px;font-weight:450;margin:8px 0}
.route-preview .muted{margin:0}.external-link{margin-top:20px;font-size:14px}
.toast{position:absolute;z-index:100;left:24px;right:24px;bottom:calc(82px + env(safe-area-inset-bottom));padding:12px 16px;background:#eee;color:#111;border-radius:4px;font-size:14px;text-align:center;opacity:0;pointer-events:none}
.toast.show{opacity:1}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:800px){.app{max-width:520px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}}
@media(max-width:350px){.topbar{padding-left:20px;padding-right:20px;gap:10px}.reel-content{left:20px;right:20px}.dish{font-size:27px}.location-pill{font-size:13px}.range-pill{font-size:13px}}
@media(max-height:690px){.reel-content{bottom:calc(80px + env(safe-area-inset-bottom))}.dish{font-size:27px}.action-stack{margin-top:12px}.detail-photo{height:90px}.hero-card p{margin-bottom:28px}.demo-note{margin-top:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div class="app" id="app">

  <section class="landing" id="landing">
    <div class="hero-card">
      <div class="eyebrow">Nearby</div>
      <h1>What’s good<br>nearby?</h1>
      <p>Find your next bite.</p>
      <button class="primary" id="locateBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" opacity=".3"/></svg>
        <span>Use my location</span>
      </button>
      <button class="secondary" id="demoBtn">Preview nearby food</button><div class="demo-note">Demo · sample food &amp; reviews</div>
    </div>
  </section>

  <main class="home" id="home" inert>
    <header class="topbar">
      <button class="location-pill" id="areaBtn" aria-label="Location options"><span id="locationName">Ampang · Demo</span></button>
      <button class="range-pill" id="rangeBtn" aria-label="Food filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="#151515"/><circle cx="15" cy="17" r="2.5" fill="#151515"/></svg><span id="rangeText">1 km</span></button>
      <button class="icon-btn" id="searchBtn" aria-label="Search food">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      </button>
    </header>

    <section class="feed" id="feed" aria-label="Nearby food feed" tabindex="0"></section>

    <section class="map-screen" id="mapScreen" inert aria-label="Demo food map">
      <div class="map-canvas"><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="road r4"></div><div class="map-overlay"></div></div>
      <div class="map-label">Ampang · Demo map</div>
      <div class="me-dot" aria-hidden="true"></div>
      <div id="mapPins"></div>
      <div class="map-card" id="mapCard"></div>
    </section>

    <section class="saved-screen" id="savedScreen" inert>
      <h2>Saved</h2>
      <div class="saved-grid" id="savedGrid"></div>
    </section>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-btn active" data-view="discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12 12 4l8 8-8 8-8-8Z"/><circle cx="12" cy="12" r="2.3"/></svg>Discover</button>
      <button class="nav-btn" data-view="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 6 5-2 8 3 5-2v13l-5 2-8-3-5 2V6Z"/><path d="M8 4v13M16 7v13"/></svg>Map</button>
      <button class="nav-btn" data-view="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg>Saved</button>
    </nav>
  </main>

  <dialog class="sheet-dialog" id="rangeDialog" aria-labelledby="rangeTitle">
    <div class="dialog-top"><div class="grab"></div><button class="close-btn" data-close aria-label="Close filters">×</button></div>
    <h2 id="rangeTitle">Filters</h2><h3>Distance</h3><div class="ranges">
      <button class="range-option" data-range="500" aria-pressed="false">500m</button><button class="range-option active" data-range="1000" aria-pressed="true">1km</button><button class="range-option" data-range="3000" aria-pressed="false">3km</button><button class="range-option" data-range="5000" aria-pressed="false">5km</button>
    </div><h3>Food</h3>
    <div class="filter-options" aria-label="Food filters">
      <div class="filter-categories">
        <button class="filter-chip active" data-category="all" aria-pressed="true">All food</button>
        <button class="filter-chip" data-category="meals" aria-pressed="false">Meals</button>
        <button class="filter-chip" data-category="sweet" aria-pressed="false">Sweet</button>
      </div>
      <div class="filter-toggles">
        <button class="filter-chip" id="openBtn" aria-pressed="false">Open now</button>
        <button class="filter-chip" id="budgetBtn" aria-pressed="false">Under RM20</button>
      </div>
    </div>
    <div class="filter-actions"><button class="primary" id="applyFilters">Show food</button><button class="secondary" id="resetFilters">Reset</button></div>
  </dialog>
  <dialog class="sheet-dialog search-dialog" id="searchDialog" aria-labelledby="searchTitle">
    <div class="dialog-top"><div class="grab"></div><button class="close-btn" data-close aria-label="Close search">×</button></div>
    <h2 id="searchTitle">Search food</h2>
    <form id="searchForm"><label class="sr-only" for="searchInput">Search food or places</label><input id="searchInput" type="search" placeholder="Ramen, burgers, a place…" autocomplete="off" /><button class="primary" type="submit">Show food</button></form>
    <button class="secondary" id="clearSearch">Clear search</button>
  </dialog>
  <dialog class="sheet-dialog detail-dialog" id="detailDialog" aria-labelledby="detailTitle"><div id="detailBody"></div></dialog>
  <dialog class="sheet-dialog" id="areaDialog" aria-labelledby="areaTitle">
    <div class="dialog-top"><div class="grab"></div><button class="close-btn" data-close aria-label="Close location options">×</button></div>
    <h2 id="areaTitle">Food around you</h2><p class="muted">Sample food in Ampang. GPS stays in this browser; live nearby results are coming later.</p>
    <button class="primary" id="retryLocation">Use my location</button><button class="secondary" id="useDemo">Browse Ampang demo</button>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
'use strict';
// All places, review text, prices, ratings, hours, and distances are fictional fixtures.
// Stock photos came from the supplied interface; there are no live social posts here.
const photos = [
  'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1200&q=88',
  'https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=1200&q=88',
  'https://images.unsplash.com/photo-1551782450-a2132b4ba21d?auto=format&fit=crop&w=1200&q=88',
  'https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=1200&q=88'
];
const FOOD = [
  {id:'ramen',dish:'Black Garlic Ramen',restaurant:'Ramen Bar',meters:320,price:24,rating:4.6,count:128,category:'meals',open:true,hours:'11am–10pm',source:'Instagram',img:photos[0],description:'Rich broth, springy noodles, and a little black garlic oil.',google:['Rich, comforting broth. The black garlic makes it.','Good noodles and a generous portion. A nice lunch stop.'],social:'The garlic oil is the highlight. A bowl I would come back for.',tiktok:'A close look at the noodles, broth, and that soft egg.'},
  {id:'dumpling',dish:'Crispy Xiao Long Bao',restaurant:'Dumpling House',meters:460,price:18,rating:4.5,count:86,category:'meals',open:true,hours:'10am–9pm',source:'TikTok',img:photos[1],description:'Juicy dumplings with a crisp base. Best shared while hot.',google:['Loved the juicy filling. Eat them while they are hot.','The crispy base is great. I would order another plate.'],social:'A dumpling stop for the next lunch break. Crispy underneath, juicy inside.',tiktok:'Breaking open a dumpling and trying the first bite.'},
  {id:'burger',dish:'Smash Cheeseburger',restaurant:'Fifty/Fifty',meters:680,price:22,rating:4.7,count:215,category:'meals',open:true,hours:'12pm–11pm',source:'TikTok',img:photos[2],description:'Crisp-edged beef, melted cheese, and a soft toasted bun.',google:['The patty has great crispy edges. Simple and satisfying.','Good burger. The lunchtime wait can be a little long.'],social:'That cheese melt and crispy edge. Keeping this one on my list.',tiktok:'A first-bite burger review with a look inside the bun.'},
  {id:'donut',dish:'Burnt Butter Donut',restaurant:'Sunday Bakes',meters:810,price:9,rating:4.4,count:64,category:'sweet',open:false,hours:'8am–5pm',source:'Instagram',img:photos[3],description:'A soft donut with a buttery glaze. A small afternoon treat.',google:['Soft dough and a lovely buttery glaze.','A sweet treat with coffee. It can sell out early.'],social:'Coffee and a buttery donut: my kind of afternoon break.',tiktok:'A bakery visit and a taste of the buttery glaze.'},
  {id:'miso',dish:'Chili Miso Ramen',restaurant:'Noodle Corner',meters:1600,price:19,rating:4.3,count:72,category:'meals',open:true,hours:'11am–10pm',source:'Google',img:photos[0],description:'A warming bowl of miso broth, noodles, and a chili kick.',google:['A good spicy bowl at a friendly price.','The miso broth is warming without being too heavy.'],social:'A spicy noodle bowl for a rainy afternoon.',tiktok:'Trying the chili broth and checking the spice level.'},
  {id:'truffle',dish:'Truffle Cheeseburger',restaurant:'Burger Lane',meters:3400,price:28,rating:4.6,count:143,category:'meals',open:true,hours:'12pm–10pm',source:'Instagram',img:photos[2],description:'Beef, cheese, and a touch of truffle sauce in a toasted bun.',google:['The truffle sauce goes well with the beef.','A filling burger. Great if you like a richer sauce.'],social:'A cheesy burger with a little truffle twist.',tiktok:'A burger taste test: sauce, patty, and bun.'}
];
const $ = id => document.getElementById(id);
const esc = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = {
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg>',
  dir:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 11 18-8-8 18-2-8-8-2Z"/></svg>',
  reviews:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-3 3V11.5A7.5 7.5 0 0 1 9.5 4h3a7.5 7.5 0 0 1 7.5 7.5Z"/><path d="M7 10h8M7 14h5"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7 10 5 5 5-5"/></svg>'
};
const validIds=new Set(FOOD.map(f=>f.id));
let saved=new Set();
try { const stored=JSON.parse(localStorage.getItem('nearby.saved.v1')||'[]'); if(Array.isArray(stored))saved=new Set(stored.filter(id=>validIds.has(id))); } catch {}
let range=1000,category='all',query='',onlyOpen=false,budget=false,currentView='discover',activeId=FOOD[0].id,mapId=FOOD[0].id,detailId=null,reviewSource='All',toastTimer;
const distance=f=>f.meters<1000?`${f.meters} m`:`${(f.meters/1000).toFixed(1)} km`;
function getFood(id){return FOOD.find(f=>f.id===id);}
function filtered(){return FOOD.filter(f=>f.meters<=range&&(category==='all'||f.category===category)&&(!onlyOpen||f.open)&&(!budget||f.price<20)&&(!query||`${f.dish} ${f.restaurant}`.toLowerCase().includes(query.toLowerCase())));}
function notify(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2700);}
function enter(){ $('landing').classList.add('hide');$('landing').inert=true;$('home').inert=false;$('home').classList.add('show');$('feed').focus({preventScroll:true}); }
function useLocation(){
  enter();$('areaDialog').close();$('locationName').textContent='Locating · Demo';
  if(!navigator.geolocation){$('locationName').textContent='Ampang · Demo';notify('Location unavailable. Browsing the Ampang demo.');return;}
  navigator.geolocation.getCurrentPosition(()=>{ $('locationName').textContent='GPS ready · Demo';notify('Location received. Food is still the Ampang demo.'); },()=>{ $('locationName').textContent='Ampang · Demo';notify('Location unavailable. Browsing the Ampang demo.'); },{enableHighAccuracy:false,timeout:6500,maximumAge:60000});
}
$('demoBtn').onclick=enter;$('locateBtn').onclick=useLocation;$('retryLocation').onclick=useLocation;
$('useDemo').onclick=()=>{$('locationName').textContent='Ampang · Demo';$('areaDialog').close();};
$('areaBtn').onclick=()=>$('areaDialog').showModal();
const observer = new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('.reel').forEach(r=>r.classList.remove('active'));e.target.classList.add('active');activeId=e.target.dataset.id;}}),{root:$('feed'),threshold:.65});
function actionButtons(f){return `<div class="action-stack"><button class="action review-action" data-action="reviews" data-id="${f.id}" aria-label="Reviews for ${esc(f.dish)}">${svg.reviews}<span>Reviews</span></button><button class="action save ${saved.has(f.id)?'is-saved':''}" data-action="save" data-id="${f.id}" aria-label="Save ${esc(f.dish)}" aria-pressed="${saved.has(f.id)}">${svg.save}</button><button class="action" data-action="go" data-id="${f.id}" aria-label="Directions for ${esc(f.dish)}">${svg.dir}</button></div>`;}
function renderFeed(){
  observer.disconnect();const items=filtered();
  $('feed').innerHTML=items.length?items.map((f,i)=>`<article class="reel ${i===0?'active':''}" data-id="${f.id}" aria-label="${esc(f.dish)} at ${esc(f.restaurant)}"><div class="reel-bg" style="background-image:url('${f.img}')" role="img" aria-label="${esc(f.dish)} stock photo"></div><div class="reel-content"><button class="dish-button" data-action="details" data-id="${f.id}" aria-label="About ${esc(f.dish)}"><h2 class="dish">${f.dish}</h2></button><p class="restaurant">${f.restaurant}</p><div class="rating-line"><button class="rating-button" data-action="reviews" data-id="${f.id}" data-source="Google" aria-label="Google reviews for ${esc(f.dish)}">★ ${f.rating}</button><span class="tiny-sep">·</span><span>RM${f.price}</span><span class="tiny-sep">·</span><span>${distance(f)}</span></div>${actionButtons(f)}</div></article>`).join(''):'<div class="empty-state"><h2>No bites found</h2><p>Try a wider distance or fewer filters.</p><button class="primary" data-action="reset">Reset filters</button></div>';
  $('feed').scrollTop=0;activeId=items[0]?.id||null;document.querySelectorAll('.reel').forEach(r=>observer.observe(r));
}
function renderSaved(){
  const allSaved=FOOD.filter(f=>saved.has(f.id));
  // Saved is a persistent collection, independent of Discover filters.
  $('savedGrid').innerHTML=allSaved.length?allSaved.map(f=>`<button class="saved-card" data-action="details" data-id="${f.id}" aria-label="About saved ${esc(f.dish)}"><img src="${f.img}" alt="${esc(f.dish)} stock photo" loading="lazy"><div><b>${f.dish}</b><span>${f.restaurant} · RM${f.price}<br>${distance(f)} · ★ ${f.rating}</span></div></button>`).join(''):'<div class="saved-empty">Nothing saved yet.<br>Tap Save on a food you want to try.<br><button class="secondary" data-action="discover">Explore food</button></div>';
}
function saveFood(id){
  saved.has(id)?saved.delete(id):saved.add(id);
  try{localStorage.setItem('nearby.saved.v1',JSON.stringify([...saved]));}catch{notify('Saved for this visit. Browser storage is unavailable.');}
  document.querySelectorAll(`[data-action="save"][data-id="${id}"]`).forEach(b=>{b.classList.toggle('is-saved',saved.has(id));b.setAttribute('aria-pressed',String(saved.has(id)));if(b.classList.contains('detail-save'))b.textContent=saved.has(id)?'Saved':'Save place';});
  renderSaved();
}
const pinPositions=[[16,24],[72,34],[30,51],[68,63],[46,27],[12,65]];
function renderMap(){
  const items=filtered();if(!items.some(f=>f.id===mapId))mapId=items[0]?.id||null;
  $('mapPins').innerHTML=items.map(f=>{const i=FOOD.indexOf(f),pos=pinPositions[i];return `<button class="pin ${f.id===mapId?'selected':''}" style="left:${pos[0]}%;top:${pos[1]}%" data-action="pin" data-id="${f.id}" aria-label="Show ${esc(f.dish)} on demo map" aria-pressed="${f.id===mapId}"><img alt="" src="${f.img}" /><span class="map-pin-label">RM${f.price}</span></button>`;}).join('');
  const f=getFood(mapId);$('mapCard').style.display=f?'flex':'none';
  $('mapCard').innerHTML=f?`<img src="${f.img}" alt="${esc(f.dish)} stock photo"><div><h3>${f.dish}</h3><p>${f.restaurant}<br>${distance(f)} · ★ ${f.rating}</p></div><button class="mini-cta" data-action="details" data-id="${f.id}" aria-label="Details for ${esc(f.dish)}">${svg.reviews}</button>`:'';
  let empty=$('mapEmpty');if(!empty){empty=document.createElement('div');empty.id='mapEmpty';empty.className='map-empty';$('mapScreen').append(empty);}empty.innerHTML=items.length?'':'No food matches these filters. <button class="secondary" data-action="reset">Reset filters</button>';
}
function setView(view){currentView=view;document.querySelectorAll('.nav-btn').forEach(b=>{const selected=b.dataset.view===view;b.classList.toggle('active',selected);selected?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current');});
  ['map','saved'].forEach(v=>{const el=$(v+'Screen');el.classList.toggle('show',view===v);el.inert=view!==v;});$('feed').inert=view!=='discover';$('rangeBtn').hidden=view==='saved';
}
function refresh(){renderFeed();renderMap();}
function syncFilters(){document.querySelectorAll('[data-category]').forEach(b=>{const on=b.dataset.category===category;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});[['openBtn',onlyOpen],['budgetBtn',budget]].forEach(([id,on])=>{$(id).classList.toggle('active',on);$(id).setAttribute('aria-pressed',String(on));});const extra=(category!=='all'?1:0)+(onlyOpen?1:0)+(budget?1:0);$('rangeText').textContent=(range===500?'500 m':`${range/1000} km`)+(extra?` · ${extra}`:'');$('rangeBtn').classList.toggle('active',!!extra);$('applyFilters').textContent=`Show ${filtered().length} places`;document.querySelectorAll('[data-range]').forEach(b=>{const on=Number(b.dataset.range)===range;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});$('searchBtn').classList.toggle('active',!!query);$('searchBtn').setAttribute('aria-label',query?`Search food: ${query}`:'Search food');}
function resetFilters(){range=1000;category='all';query='';onlyOpen=false;budget=false;$('searchInput').value='';syncFilters();refresh();}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;syncFilters();refresh();});
$('openBtn').onclick=()=>{onlyOpen=!onlyOpen;syncFilters();refresh();};$('budgetBtn').onclick=()=>{budget=!budget;syncFilters();refresh();};
$('rangeBtn').onclick=()=>$('rangeDialog').showModal();
$('applyFilters').onclick=()=>$('rangeDialog').close();$('resetFilters').onclick=resetFilters;
document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=Number(b.dataset.range);syncFilters();refresh();});
$('searchBtn').onclick=()=>{$('searchInput').value=query;$('searchDialog').showModal();$('searchInput').focus();};
$('searchForm').onsubmit=e=>{e.preventDefault();query=$('searchInput').value.trim();syncFilters();refresh();setView('discover');$('searchDialog').close();};
$('clearSearch').onclick=()=>{query='';$('searchInput').value='';syncFilters();refresh();$('searchDialog').close();};
function reviewsFor(f){return [{source:'Google',author:'Alex L.',date:'2 days ago',rating:5,text:f.google[0]},{source:'Google',author:'Jamie T.',date:'1 week ago',rating:4,text:f.google[1]},{source:'Instagram',author:'@weekend.bites.demo',date:'3 days ago',text:f.social},{source:'TikTok',author:'@firstbite.demo',date:'5 days ago',text:f.tiktok}];}
function reviewCards(f){const items=reviewsFor(f).filter(r=>reviewSource==='All'||r.source===reviewSource);return items.map(r=>`<article class="review-card"><div class="review-head"><div class="review-by">${r.author}<small>${r.date} · Sample</small></div><span class="review-source">${r.source}</span></div>${r.rating?`<div class="review-stars" aria-label="${r.rating} out of 5 stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>`:'<span class="demo-label">'+(r.source==='Instagram'?'Post preview':'Video preview')+'</span>'}<p>${r.text}</p>${r.source!=='Google'?'<div class="review-foot">Sample '+(r.source==='Instagram'?'post':'video description')+' · no live media connected</div>':''}</article>`).join('');}
function renderDetail(id,source='All'){
  detailId=id;reviewSource=source;const f=getFood(id);
  $('detailBody').innerHTML=`<div class="dialog-top"><div class="grab"></div><button class="close-btn" data-close aria-label="Close place details">×</button></div><img class="detail-photo" src="${f.img}" alt="${f.dish} stock photo"><h2 id="detailTitle">${f.dish}</h2><p class="muted">${f.restaurant} · Demo place</p><div class="detail-meta"><span>★ ${f.rating} (${f.count})</span><span>RM${f.price}</span><span>${distance(f)}</span><span>${f.open?'Open now':'Closed'} · ${f.hours}</span></div><div class="detail-actions"><button class="primary outline detail-save" data-action="save" data-id="${f.id}" aria-pressed="${saved.has(f.id)}">${saved.has(f.id)?'Saved':'Save place'}</button><button class="primary" data-action="go" data-id="${f.id}">Directions</button></div><div class="review-tabs" aria-label="Review source">${['All','Google','Instagram','TikTok'].map(s=>`<button class="review-tab ${s===source?'active':''}" data-review-source="${s}" aria-pressed="${s===source}">${s}</button>`).join('')}</div><div id="reviewList">${reviewCards(f)}</div><p class="reviews-note">Sample data &amp; illustrative photos. Social posts are previews; no live media.</p>`;
  $('detailDialog').scrollTop=0;if(!$('detailDialog').open)$('detailDialog').showModal();
}
function routePreview(id){const f=getFood(id);detailId=id;const minutes=Math.max(1,Math.round(f.meters/80));
  $('detailBody').innerHTML=`<div class="dialog-top"><div class="grab"></div><button class="close-btn" data-close aria-label="Close directions">×</button></div><h2 id="detailTitle">Getting there</h2><p class="muted">${f.restaurant} · Ampang · Demo place</p><div class="route-preview"><span class="demo-label">Demo walking estimate</span><strong>${minutes} min</strong><p class="muted">${distance(f)} from the demo starting point</p></div><p class="muted">Demo route. Search Google Maps for real places serving this food.</p><a class="primary external-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.dish+' Ampang Malaysia')}" target="_blank" rel="noopener noreferrer">Search Google Maps</a><button class="secondary" data-action="details" data-id="${f.id}">Back to place</button>`;
  $('detailDialog').scrollTop=0;if(!$('detailDialog').open)$('detailDialog').showModal();
}
document.addEventListener('click',e=>{
  const close=e.target.closest('[data-close]');if(close){close.closest('dialog').close();return;}
  const tab=e.target.closest('[data-review-source]');if(tab){reviewSource=tab.dataset.reviewSource;document.querySelectorAll('[data-review-source]').forEach(b=>{const on=b===tab;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});$('reviewList').innerHTML=reviewCards(getFood(detailId));return;}
  const b=e.target.closest('[data-action]');if(!b)return;const {action,id,source}=b.dataset;
  if(action==='save')saveFood(id);if(action==='details'||action==='reviews')renderDetail(id,source||'All');if(action==='go')routePreview(id);if(action==='pin'){mapId=id;renderMap();}if(action==='reset')resetFilters();if(action==='discover')setView('discover');
});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
$('feed').addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();$('feed').scrollBy({top:(e.key==='ArrowDown'?1:-1)*$('feed').clientHeight,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}});
renderFeed();renderSaved();renderMap();syncFilters();setView('discover');

</script>
</body>
</html>
