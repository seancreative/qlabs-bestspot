<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>NEARBY — Social Food Discovery</title>
  <meta name="description" content="A web prototype for scrolling nearby food and exploring Google, Instagram, and TikTok reviews." />
  <style>
:root{--bg:#101010;--text:#f5f5f5;--muted:#a0a0a0;--stroke:#303030;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#080808;color:var(--text);overflow:hidden}
button,input,a{font:inherit;touch-action:manipulation}
button{color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,.feed:focus-visible{outline:2px solid #fff;outline-offset:4px}
button[hidden],[hidden]{display:none!important}
.app{height:100svh;position:relative;overflow:clip;background:var(--bg)}
[inert]{pointer-events:none}
.primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;padding:13px 18px;border:0;border-radius:6px;background:#f5f5f5;color:#111;font-size:15px;font-weight:550;text-decoration:none}
.primary svg{width:18px;height:18px}
.secondary{min-height:44px;padding:10px 0;border:0;background:none;color:var(--muted);font-size:14px}
.muted{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.6}
.landing{position:absolute;inset:0;z-index:10;display:flex;align-items:center;padding:32px;background:var(--bg)}
.landing.hide{display:none}
.hero-card{width:100%;max-width:350px;margin:auto}
.eyebrow{margin-bottom:24px;font-size:14px;font-weight:500}
h1{margin:0;font-size:46px;font-weight:550;line-height:1.06;letter-spacing:-.045em}
.hero-card p{margin:20px 0 40px;font-size:16px;line-height:1.6;color:var(--muted);max-width:260px}
.hero-card .secondary{display:block;width:100%;margin-top:8px;text-align:center}
.demo-note{margin-top:32px;color:var(--muted);font-size:12px}
.home{position:absolute;inset:0;z-index:5;visibility:hidden}
.home.show{visibility:visible}
.topbar{position:absolute;z-index:30;left:0;right:0;top:0;height:calc(72px + env(safe-area-inset-top));padding:calc(12px + env(safe-area-inset-top)) 24px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(#0008,transparent);pointer-events:none}
.location-pill,.range-pill,.icon-btn{pointer-events:auto;display:flex;align-items:center;min-height:44px;padding:0;border:0;background:none;border-radius:0;box-shadow:none}
.location-pill{min-width:0;margin-right:auto;font-size:14px;font-weight:500}
.location-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.range-pill{flex-shrink:0;gap:7px;font-size:14px;color:#eee}
.range-pill svg{width:17px;height:17px}
.icon-btn{flex-shrink:0;width:32px;justify-content:flex-end;position:relative}
.icon-btn svg{width:20px;height:20px}
.icon-btn.active:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;right:0;bottom:4px;background:#fff}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{height:100svh;position:relative;overflow:clip;scroll-snap-align:start;background:#161616}
.reel-bg{position:absolute;inset:0;background-position:center;background-size:cover}
.reel:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0004,transparent 18%,transparent 42%,#0009 68%,#101010 91%);pointer-events:none}
.reel-content{position:absolute;z-index:4;left:24px;right:24px;bottom:calc(96px + env(safe-area-inset-bottom))}
.dish-button{display:block;text-align:left;padding:0;border:0;background:none}
.dish{max-width:360px;margin:0 0 10px;font-size:30px;font-weight:550;line-height:1.12;letter-spacing:-.035em;overflow-wrap:anywhere}
.restaurant{margin:0;font-size:15px;line-height:1.4;color:#ddd}
.rating-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;font-size:14px;color:#ccc}
.rating-button{padding:0;border:0;background:none;font-size:14px;color:#eee;min-height:30px}
.tiny-sep{color:#888}
.action-stack{display:flex;gap:12px;align-items:center;margin-top:20px}
.action{display:flex;align-items:center;justify-content:center;gap:8px;width:44px;height:44px;padding:0;border:0;background:none;border-radius:4px}
.action svg{width:21px;height:21px}
.review-action{width:auto;margin-right:auto;font-size:14px}
.review-action svg{width:18px;height:18px}
.action.is-saved svg{fill:currentColor}
.bottom-nav{position:absolute;z-index:40;left:0;right:0;bottom:0;height:calc(68px + env(safe-area-inset-bottom));padding:0 24px env(safe-area-inset-bottom);display:flex;justify-content:space-between;align-items:center;background:#101010;border-top:1px solid #ffffff0d}
.nav-btn{position:relative;min-height:52px;padding:0;border:0;background:none;color:#888;font-size:14px;font-weight:450}
.nav-btn.active{color:#fff}
.nav-btn.active:after{content:"";position:absolute;bottom:5px;left:0;right:0;height:1px;background:#fff}
.nav-btn svg{display:none}
.map-screen,.saved-screen{display:none;position:absolute;inset:0;z-index:12;background:var(--bg);overflow:clip}
.map-screen.show,.saved-screen.show{display:block}
.map-canvas{position:absolute;inset:0;background:#181818}
.road{position:absolute;background:#242424;transform-origin:left center}
.road.r1{width:120%;height:12px;left:-10%;top:34%;transform:rotate(-12deg)}
.road.r2{width:110%;height:8px;left:-12%;top:58%;transform:rotate(18deg)}
.road.r3{width:86%;height:6px;left:14%;top:72%;transform:rotate(-4deg)}
.road.r4{width:8px;height:78%;left:57%;top:8%;transform:rotate(8deg)}
.map-label{position:absolute;z-index:2;top:94px;left:24px;color:var(--muted);font-size:12px}
.me-dot{position:absolute;left:51%;top:46%;width:10px;height:10px;border:2px solid #fff;border-radius:50%;background:#999}
.pin{position:absolute;z-index:3;width:48px;height:48px;padding:2px;background:#202020;border:1px solid #555;border-radius:50%}
.pin.selected{border:2px solid #fff}
.pin img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.map-pin-label{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:#ddd}
.map-card{position:absolute;z-index:7;bottom:calc(88px + env(safe-area-inset-bottom));left:24px;right:24px;display:flex;align-items:center;gap:12px;padding:16px;background:#101010;border-radius:6px}
.map-card img{width:54px;height:64px;object-fit:cover;border-radius:3px}
.map-card h3{margin:0 0 6px;font-size:16px;font-weight:500;line-height:1.3}
.map-card p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.mini-cta{display:grid;place-items:center;flex-shrink:0;width:36px;height:44px;margin-left:auto;background:none;border:0}
.mini-cta svg{width:20px;height:20px}
.map-empty{position:absolute;left:24px;right:24px;top:42%;text-align:center;color:var(--muted);font-size:15px}
.saved-screen{padding:100px 24px calc(100px + env(safe-area-inset-bottom));overflow-y:auto}
.saved-screen h2{margin:0 0 26px;font-size:28px;font-weight:500;letter-spacing:-.03em}
.saved-grid{display:flex;flex-direction:column}
.saved-card{display:flex;align-items:center;width:100%;gap:16px;padding:20px 0;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid #282828}
.saved-card img{width:80px;height:92px;flex-shrink:0;object-fit:cover;border-radius:3px}
.saved-card b{display:block;margin-bottom:8px;font-size:16px;line-height:1.4;font-weight:500}
.saved-card span{font-size:13px;line-height:1.7;color:var(--muted)}
.saved-empty{font-size:16px;line-height:1.7;color:var(--muted)}
.empty-state{height:100%;display:flex;flex-direction:column;justify-content:center;padding:120px 32px;background:var(--bg)}
.empty-state h2{font-size:28px;font-weight:500;letter-spacing:-.03em;margin:0 0 14px}
.empty-state p{font-size:16px;line-height:1.6;color:var(--muted);margin:0 0 26px}
.empty-state .primary{width:auto;align-self:flex-start}
.sheet-dialog{position:fixed;inset:auto 0 0;margin:0 auto;width:min(100%,520px);max-height:calc(100svh - 32px);padding:20px 24px calc(28px + env(safe-area-inset-bottom));border:0;border-top:1px solid #333;border-radius:12px 12px 0 0;color:var(--text);background:#181818;overflow-y:auto;overscroll-behavior:contain}
.sheet-dialog::backdrop{background:#0008}
.dialog-top{height:36px;position:relative}
.grab{width:30px;height:2px;background:#555;margin:0 auto}
.close-btn{display:grid;place-items:center;position:absolute;top:-8px;right:-8px;width:40px;height:40px;padding:0;background:none;border:0;font-size:26px;font-weight:300;color:#aaa}
.sheet-dialog h2{font-size:24px;line-height:1.2;letter-spacing:-.025em;font-weight:500;margin:6px 0 12px}
.sheet-dialog h3,.filter-title{font-size:14px;line-height:1.4;font-weight:500;margin:26px 0 12px}
.ranges,.filter-categories{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.filter-categories{grid-template-columns:repeat(3,1fr)}
.range-option,.filter-chip{min-height:44px;padding:10px 6px;border:1px solid #3b3b3b;border-radius:4px;background:none;font-size:14px;font-weight:400}
.range-option.active,.filter-chip.active{border-color:#ddd;background:#eee;color:#111}
.filter-toggles{display:flex;gap:10px;margin:20px 0 28px}
.filter-toggles .filter-chip{flex:1}
.filter-actions{display:flex;align-items:center;gap:24px;margin-top:24px}
.filter-actions .secondary{padding:12px 8px}
#searchInput{width:100%;padding:14px 0;margin:8px 0 24px;background:none;border:0;border-bottom:1px solid #555;border-radius:0;color:#fff;font-size:18px}
.detail-photo{width:100%;height:128px;object-fit:cover;margin:4px 0 16px;border-radius:3px}
.detail-meta{display:flex;gap:8px 16px;flex-wrap:wrap;color:#ccc;font-size:14px;line-height:1.6;margin:18px 0}
.detail-actions{display:flex;gap:12px;margin:22px 0 28px}
.detail-actions button{flex:1;font-size:14px}
.detail-actions .outline{border:1px solid #555;background:none;color:#eee}
.review-tabs{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #333;margin-bottom:4px}
.review-tab{position:relative;min-height:44px;padding:10px 0;border:0;background:none;font-size:14px;color:var(--muted)}
.review-tab.active{color:#fff}
.review-tab.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:1px;background:#eee}
.review-card{padding:20px 0;border-bottom:1px solid #303030}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.review-by{flex:1;font-size:14px}.review-by small{display:block;margin-top:5px;color:var(--muted);font-size:12px}
.review-source{font-size:12px;color:var(--muted)}
.review-card p{font-size:16px;line-height:1.6;margin:8px 0 0}
.review-foot,.demo-label,.reviews-note{font-size:12px;line-height:1.6;color:var(--muted)}
.review-foot{margin-top:10px}.review-stars{font-size:13px;letter-spacing:1px;color:#ddd}.reviews-note{margin:20px 0 0}
.route-preview{padding:24px 0;margin:12px 0;border-top:1px solid #333;border-bottom:1px solid #333}
.route-preview strong{display:block;font-size:36px;font-weight:450;margin:8px 0}
.route-preview .muted{margin:0}.external-link{margin-top:20px;font-size:14px}
.toast{position:absolute;z-index:100;left:24px;right:24px;bottom:calc(82px + env(safe-area-inset-bottom));padding:12px 16px;background:#eee;color:#111;border-radius:4px;font-size:14px;text-align:center;opacity:0;pointer-events:none}
.toast.show{opacity:1}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:800px){.app{max-width:520px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}}
@media(max-width:350px){.topbar{padding-left:20px;padding-right:20px;gap:10px}.reel-content{left:20px;right:20px}.dish{font-size:27px}.location-pill{font-size:13px}.range-pill{font-size:13px}}
@media(max-height:690px){.reel-content{bottom:calc(80px + env(safe-area-inset-bottom))}.dish{font-size:27px}.action-stack{margin-top:12px}.detail-photo{height:90px}.hero-card p{margin-bottom:28px}.demo-note{margin-top:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.reel-bg{width:100%;height:100%;object-fit:cover}
.photo-status{position:absolute;z-index:3;top:90px;left:24px;color:#ccc;font-size:13px;display:flex;gap:12px;align-items:center}
.photo-status .secondary{min-height:32px;padding:0}
.area-choices{margin:16px 0 24px}
.area-choice{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;padding:12px 0;border:0;border-bottom:1px solid #333;background:none;text-align:left;font-size:16px}
.area-choice span{font-size:12px;color:var(--muted)}
.map-stage{position:absolute;inset:0;touch-action:none;transform-origin:50% 47%;cursor:grab}
.map-stage:active{cursor:grabbing}
.map-label{pointer-events:none}
.map-radius{position:absolute;top:20%;left:14%;width:72%;height:54%;border:1px solid #ffffff12;border-radius:50%;pointer-events:none}
.map-radius span{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:12px;color:#666}
.me-dot{left:calc(50% - 5px);top:calc(47% - 5px)}
.map-controls{position:absolute;z-index:4;top:90px;right:24px;display:flex;flex-direction:column;background:#101010;border:1px solid #303030;border-radius:4px}
.map-controls button{width:40px;height:40px;display:grid;place-items:center;background:none;border:0;color:#ddd;font-size:23px}
.map-controls button+button{border-top:1px solid #303030}
.map-controls button:disabled{color:#555;cursor:default}
.map-controls svg{width:18px;height:18px}
</style>
</head>
<body>
<div class="app" id="app">

  <section class="landing" id="landing">
    <div class="hero-card">
      <div class="eyebrow">Nearby</div>
      <h1>What’s good<br>nearby?</h1>
      <p>Find your next bite.</p>
      <button class="primary" id="locateBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" opacity=".3"/></svg>
        <span>Use my location</span>
      </button>
      <button class="secondary" id="demoBtn">Preview nearby food</button><div class="demo-note">Demo · sample food &amp; reviews</div>
    </div>
  </section>

  <main class="home" id="home" inert>
    <header class="topbar">
      <button class="location-pill" id="areaBtn" aria-label="Location options"><span id="locationName">Ampang · Demo</span></button>
      <button class="range-pill" id="rangeBtn" aria-label="Food filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="#151515"/><circle cx="15" cy="17" r="2.5" fill="#151515"/></svg><span id="rangeText">1 km</span></button>
      <button class="icon-btn" id="searchBtn" aria-label="Search food">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      </button>
    </header>

    <section class="feed" id="feed" aria-label="Nearby food feed" tabindex="0"></section>

    <section class="map-screen" id="mapScreen" inert aria-label="Demo food map">
      <div class="map-stage" id="mapStage"><div class="map-canvas"><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="road r4"></div><div class="map-overlay"></div></div>

      <div class="me-dot" aria-hidden="true"></div><div class="map-radius" aria-hidden="true"><span id="mapRange">1 km</span></div>
      <div id="mapPins"></div></div><div class="map-label" id="mapLabel">Ampang · Demo map</div><div class="map-empty" id="mapEmpty"></div><div class="map-controls"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="recenterMap" aria-label="Recenter map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg></button></div>
      <div class="map-card" id="mapCard"></div>
    </section>

    <section class="saved-screen" id="savedScreen" inert>
      <h2>Saved</h2>
      <div class="saved-grid" id="savedGrid"></div>
    </section>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-btn active" data-view="discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12 12 4l8 8-8 8-8-8Z"/><circle cx="12" cy="12" r="2.3"/></svg>Discover</button>
      <button class="nav-btn" data-view="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 6 5-2 8 3 5-2v13l-5 2-8-3-5 2V6Z"/><path d="M8 4v13M16 7v13"/></svg>Map</button>
      <button class="nav-btn" data-view="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg>Saved</button>
    </nav>
  </main>

  <dialog class="sheet-dialog" id="rangeDialog" aria-labelledby="rangeTitle">
    <div class="dialog-top"><div class="grab"></div><button class="close-btn" data-close aria-label="Close filters">×</button></div>
    <h2 id="rangeTitle">Filters</h2><h3>Distance</h3><div class="ranges">
      <button class="range-option" data-range="500" aria-pressed="false">500m</button><button class="range-option active" data-range="1000" aria-pressed="true">1km</button><button class="range-option" data-range="3000" aria-pressed="false">3km</button><button class="range-option" data-range="5000" aria-pressed="false">5km</button>
    </div><h3>Food</h3>
    <div class="filter-options" aria-label="Food filters">
      <div class="filter-categories">
        <button class="filter-chip active" data-category="all" aria-pressed="true">All food</button>
        <button class="filter-chip" data-category="meals" aria-pressed="false">Meals</button>
        <button class="filter-chip" data-category="sweet" aria-pressed="false">Sweet</button>
      </div>
      <div class="filter-toggles">
        <button class="filter-chip" id="openBtn" aria-pressed="false">Open now</button>
        <button class="filter-chip" id="budgetBtn" aria-pressed="false">Under RM20</button>
      </div>
    </div>
    <div class="filter-actions"><button class="primary" id="applyFilters">Show food</button><button class="secondary" id="resetFilters">Reset</button></div>
  </dialog>
  <dialog class="sheet-dialog search-dialog" id="searchDialog" aria-labelledby="searchTitle">
    <div class="dialog-top"><div class="grab"></div><button class="close-btn" data-close aria-label="Close search">×</button></div>
    <h2 id="searchTitle">Search food</h2>
    <form id="searchForm"><label class="sr-only" for="searchInput">Search food or places</label><input maxlength="100" id="searchInput" type="search" placeholder="Ramen, burgers, a place…" autocomplete="off" /><button class="primary" type="submit">Show food</button></form>
    <button class="secondary" id="clearSearch">Clear search</button>
  </dialog>
  <dialog class="sheet-dialog detail-dialog" id="detailDialog" aria-labelledby="detailTitle"><div id="detailBody"></div></dialog>
  <dialog class="sheet-dialog" id="areaDialog" aria-labelledby="areaTitle">
    <div class="dialog-top"><div class="grab"></div><button class="close-btn" data-close aria-label="Close location options">×</button></div>
    <h2 id="areaTitle">Food around you</h2><p class="muted">Choose a demo area, or use GPS to see the sample places relative to you.</p>
    <div id="areaChoices" class="area-choices"></div><button class="primary" id="retryLocation">Use my location</button><button class="secondary" id="useDemo">Keep current area</button>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="model.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
